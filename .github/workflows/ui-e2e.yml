name: Web UI E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      E2E_MOCK_API: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: >-
          npm run e2e --
          e2e/tests/a11y.spec.ts
          e2e/tests/errors.spec.ts
          e2e/tests/hos-scenarios.spec.ts
          e2e/tests/log-sheets.spec.ts
          e2e/tests/responsive.spec.ts
          e2e/tests/route-map.spec.ts
          e2e/tests/share-link.spec.ts
          e2e/tests/trip-form.spec.ts
          --workers=4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-playwright-report
          path: |
            playwright-report
            test-results
